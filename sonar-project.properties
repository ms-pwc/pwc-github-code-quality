# SonarQube project configuration for pwc-github-code-quality
sonar.projectKey=pwc-github-code-quality
sonar.projectName=PWC GitHub Code Quality Demo - SonarQube Branch
sonar.projectVersion=1.0.0
sonar.sources=src
sonar.tests=tests
sonar.sourceEncoding=UTF-8

# C# specific settings
sonar.language=cs
sonar.csharp.analyzers.projectOutPaths=src/QualityDemo/bin/Release/net10.0/,tests/QualityDemo.Tests/bin/Release/net10.0/

# Exclusions
sonar.exclusions=**/bin/**,**/obj/**,**/node_modules/**
sonar.test.exclusions=**/obj/**

# Coverage settings - adjust path if using different coverage tool
sonar.coverage.exclusions=tests/**

# Quality gate
sonar.projectBaseDir=.
