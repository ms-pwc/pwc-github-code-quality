# GitHub Code Quality demo: CodeQL security/quality analysis workflow.
# This is the GitHub-native replacement for the SonarQube scan that runs on
# the `sonarqube` branch. It uses GitHub's built-in static analysis engine
# (CodeQL) instead of a self-hosted/SaaS third-party server.
#
# Results appear in the repository's Security tab under
# "Code scanning alerts" (Security > Code scanning), not in a separate
# dashboard the way SonarQube's http://localhost:9000 UI works.
name: CodeQL Analysis

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  schedule:
    # Weekly scheduled scan so alerts are refreshed even without new commits.
    - cron: "23 3 * * 1"
  workflow_dispatch:

permissions:
  contents: read
  security-events: write # required to upload SARIF results to the Security tab
  actions: read

jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    runs-on: ubuntu-latest
    timeout-minutes: 30

    strategy:
      fail-fast: false
      matrix:
        # Only C# is analyzed because this repository is a .NET solution.
        language: [ 'csharp' ]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      # Initializes the CodeQL tools for scanning and sets up the config,
      # including the security-and-quality query pack (broader than the
      # default security-only pack) so results are comparable to SonarQube's
      # combined bug/vulnerability/code-smell reporting.
      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: ${{ matrix.language }}
          config-file: ./.github/codeql/codeql-config.yml
          queries: security-and-quality

      # CodeQL needs to observe an actual compile for compiled languages
      # such as C#, so the build happens between init and analyze.
      - name: Build solution
        run: |
          dotnet restore Pwc.GitHubCodeQuality.slnx
          dotnet build Pwc.GitHubCodeQuality.slnx --configuration Release --no-restore

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v4
        with:
          category: "/language:${{ matrix.language }}"
