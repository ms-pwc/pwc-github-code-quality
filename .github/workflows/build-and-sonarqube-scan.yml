# SonarQube baseline used by the client demonstration.
#
# Required repository secrets:
#   SONAR_HOST_URL - a SonarQube URL reachable from the GitHub-hosted runner
#   SONAR_TOKEN    - a project analysis token
#
# A developer's http://localhost:9000 is intentionally not used as a fallback:
# localhost on a GitHub-hosted runner is not the developer workstation.
name: SonarQube Code Quality

on:
  push:
    branches:
      - sonarqube
  pull_request:
    branches:
      - sonarqube
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sonarqube-quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  sonarqube:
    name: Build, test, and analyze with SonarQube
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - name: Install analysis tools
        run: |
          dotnet tool install --global dotnet-sonarscanner
          dotnet tool install --global dotnet-coverage

      - name: Restore dependencies
        run: dotnet restore Pwc.GitHubCodeQuality.slnx

      # Run this before SonarScanner injects the Sonar analyzer targets. Once
      # analysis starts, Sonar diagnostics are intentionally emitted as build
      # warnings and can make `dotnet format --verify-no-changes` return nonzero.
      - name: Verify formatting
        run: dotnet format Pwc.GitHubCodeQuality.slnx --verify-no-changes --verbosity minimal

      - name: Start SonarQube analysis
        env:
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: |
          dotnet sonarscanner begin \
            /k:"pwc-github-code-quality" \
            /n:"PWC GitHub Code Quality" \
            /d:sonar.host.url="${SONAR_HOST_URL}" \
            /d:sonar.token="${SONAR_TOKEN}" \
            /d:sonar.cs.vscoveragexml.reportsPaths="TestResults/coverage.xml" \
            /d:sonar.qualitygate.wait=true \
            /d:sonar.qualitygate.timeout=300 \
            /d:sonar.scanner.scanAll=false \
            /d:sonar.exclusions="**/bin/**,**/obj/**,docs/**,.github/**"

      - name: Build
        run: dotnet build Pwc.GitHubCodeQuality.slnx --configuration Release --no-restore

      - name: Run tests and collect coverage
        run: |
          mkdir -p TestResults
          dotnet-coverage collect \
            "dotnet run --project tests/QualityDemo.Tests/QualityDemo.Tests.csproj --configuration Release --no-build" \
            -f xml \
            -o TestResults/coverage.xml

      - name: Publish analysis and wait for quality gate
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: dotnet sonarscanner end /d:sonar.token="${SONAR_TOKEN}"
