# One GitHub-native code quality workflow for the client demonstration.
#
# The three jobs reproduce the pull-request protection outcomes demonstrated
# with SonarQube on the `sonarqube` branch:
#   1. build, formatting, and tests;
#   2. CodeQL data-flow security and quality analysis;
#   3. full .NET/Roslyn analysis uploaded to GitHub code scanning as SARIF.
name: GitHub Native Code Quality

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  schedule:
    - cron: "23 3 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: code-quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality-gate:
    name: Build, format, and test
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - name: Restore dependencies
        run: dotnet restore Pwc.GitHubCodeQuality.slnx

      - name: Build
        run: dotnet build Pwc.GitHubCodeQuality.slnx --configuration Release --no-restore

      - name: Verify formatting
        run: dotnet format Pwc.GitHubCodeQuality.slnx --verify-no-changes --verbosity minimal

      - name: Run quality tests
        run: dotnet run --project tests/QualityDemo.Tests/QualityDemo.Tests.csproj --configuration Release --no-build

  codeql:
    name: CodeQL (C#)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      actions: read
      contents: read
      security-events: write

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: csharp
          config-file: ./.github/codeql/codeql-config.yml
          queries: security-and-quality

      - name: Build solution for CodeQL
        run: |
          dotnet restore Pwc.GitHubCodeQuality.slnx
          dotnet build Pwc.GitHubCodeQuality.slnx --configuration Release --no-restore

      - name: Perform CodeQL analysis
        uses: github/codeql-action/analyze@v4
        with:
          category: /language:csharp

  dotnet-analyzers:
    name: Roslyn analyzers to code scanning
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      actions: read
      contents: read
      security-events: write

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - name: Restore dependencies
        run: dotnet restore Pwc.GitHubCodeQuality.slnx

      - name: Build with analyzers and emit SARIF
        run: |
          mkdir -p sarif
          dotnet build Pwc.GitHubCodeQuality.slnx \
            --configuration Release \
            --no-restore \
            --no-incremental \
            -p:SarifOutputDir="${{ github.workspace }}/sarif" \
            -p:TreatWarningsAsErrors=false

      - name: Merge per-project SARIF files
        shell: pwsh
        run: ./scripts/Merge-AnalyzerSarif.ps1 -InputDirectory sarif -OutputPath dotnet-analyzers.sarif

      - name: Upload SARIF to code scanning
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: dotnet-analyzers.sarif
          category: dotnet-analyzers

      - name: Upload SARIF artifact
        uses: actions/upload-artifact@v4
        with:
          name: dotnet-analyzers-sarif
          path: dotnet-analyzers.sarif