# GitHub Code Quality demo: automated dependency updates.
# This is the GitHub-native equivalent of SonarQube's dependency/vulnerability
# scanning. Dependabot opens pull requests when a dependency has a newer
# version or a known vulnerability (paired with GitHub's Dependency Graph
# and Dependabot alerts, enabled from Settings > Code security).
version: 2
updates:
  - package-ecosystem: "nuget"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 10
    labels:
      - "dependencies"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    labels:
      - "dependencies"
      - "ci"
